name: Build, Push and Terraform Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tf_action:
        description: "Terraform Action (apply/destroy)"
        required: true
        default: "apply"


env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: gradle-hello-app

permissions:
  id-token: write     # REQUIRED for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set TF_ACTION
      run: |
        if [ "${{ github.event.inputs.tf_action }}" = "" ]; then
          echo "TF_ACTION=apply" >> $GITHUB_ENV
        else
          echo "TF_ACTION=${{ github.event.inputs.tf_action }}" >> $GITHUB_ENV
        fi

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Grant execute permission for Gradle
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Set Commit SHA
      run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    # ✅ OIDC Authentication (NO secrets required)
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    # Login to ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Build Docker image
    - name: Build Docker image
      run: |
        docker build -t $ECR_REPOSITORY:$COMMIT_SHA .

    # Tag Docker image
    - name: Tag Docker image
      run: |
        docker tag $ECR_REPOSITORY:$COMMIT_SHA \
        ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$COMMIT_SHA

    # Push image to ECR
    - name: Push Docker image to ECR
      run: |
        docker push \
        ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$COMMIT_SHA

    # Install Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # Terraform Init
    - name: Terraform Init
      working-directory: infra
      run: terraform init

    # Terraform Apply
    - name: Terraform Apply
      working-directory: infra
      if: env.TF_ACTION == 'apply'
      run: |
        terraform plan -out=tfplan
        terraform apply -auto-approve tfplan

    # Terraform Destroy
    - name: Terraform Destroy
      working-directory: infra
      if: env.TF_ACTION == 'destroy'
      run: terraform destroy -auto-approve
